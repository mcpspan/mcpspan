[package]
name = "adapter"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mcpspan = { path = "../../../packages/mcpspan-rust" }
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
