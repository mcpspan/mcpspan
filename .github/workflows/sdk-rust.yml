name: SDK (Rust)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: sdk-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Only where the code is public: the private repository is tested before every export.
    if: github.repository == 'mcpspan/mcpspan'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    # The oldest Rust the crate declares, and the newest; and the newest of
    # every dependency, rmcp above all, against the lockfile's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust 1.88
            rust: '1.88'
          - name: Rust stable
            rust: stable
          - name: Rust stable, newest dependencies
            rust: stable
            update: true

    defaults:
      run:
        working-directory: packages/mcpspan-rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt && rustup default ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/mcpspan-rust

      # A new rmcp can add a ServerHandler method with a default, which the
      # wrapper would silently leave out; tests/handler.rs catches that here.
      - if: matrix.update
        run: cargo update

      - name: Formatted
        if: matrix.rust == 'stable'
        run: cargo fmt --check

      - if: matrix.rust == 'stable'
        run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - if: matrix.rust == 'stable' && !matrix.update
        run: cargo package

  conformance:
    # Only where the code is public: the private repository is tested before every export.
    if: github.repository == 'mcpspan/mcpspan'
    name: Conformance, protocol ${{ matrix.protocol }}
    runs-on: ubuntu-latest

    # The same suite the other SDKs pass, through a real MCP client over
    # stdio, on both protocol revisions rmcp speaks.
    strategy:
      fail-fast: false
      matrix:
        protocol: ['2025', '2026']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: conformance/adapters/rust

      - run: cargo build --release
        working-directory: conformance/adapters/rust

      # rmcp fails a tool with an ErrorData, which has a code but no type;
      # the SDK names it by the code.
      - run: pnpm --filter @mcpspan/conformance test
        env:
          CONFORMANCE_ADAPTER: '["adapters/rust/target/release/adapter"]'
          CONFORMANCE_PROTOCOL: ${{ matrix.protocol }}
          CONFORMANCE_EXCEPTION_TYPE: InternalError
