name: SDK (.NET)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: sdk-dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Build and test, .NET 8, 9 and 10
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/mcpspan-dotnet

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every runtime still supported, from the oldest the package targets,
      # with the SDK global.json asks for.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Warnings are errors in every project here, so this also holds the
      # analyzers' verdict.
      - run: dotnet build -c Release

      - run: dotnet test -c Release -p:TestAllFrameworks=true

      - run: dotnet pack src/McpSpan -c Release -o ${{ runner.temp }}/package

  conformance:
    name: Conformance, protocol ${{ matrix.protocol }}
    runs-on: ubuntu-latest

    # The same suite the other SDKs pass, through a real MCP client over
    # stdio, on both protocol revisions the MCP C# SDK speaks.
    strategy:
      fail-fast: false
      matrix:
        protocol: ['2025', '2026']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release -o out
        working-directory: conformance/adapters/dotnet

      - run: pnpm --filter @mcpspan/conformance test
        env:
          CONFORMANCE_ADAPTER: '["dotnet", "adapters/dotnet/out/Adapter.dll"]'
          CONFORMANCE_PROTOCOL: ${{ matrix.protocol }}
