name: SDK (Ruby)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: sdk-ruby-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only where the code is public: the private repository is tested before every export.
    if: github.repository == 'mcpspan/mcpspan'
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    # The oldest Ruby the gem declares and the newest. Neither lockfile is
    # kept, so every run takes the newest mcp gem: the SDK hooks two of its
    # private methods, and a release that moves them should fail here first.
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']

    defaults:
      run:
        working-directory: packages/mcpspan-ruby

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/mcpspan-ruby

      - run: bundle exec rake test

      - if: matrix.ruby == '4.0'
        run: bundle exec rubocop

      - if: matrix.ruby == '4.0'
        run: gem build mcpspan.gemspec

  conformance:
    # Only where the code is public: the private repository is tested before every export.
    if: github.repository == 'mcpspan/mcpspan'
    name: Conformance, protocol ${{ matrix.protocol }}
    runs-on: ubuntu-latest

    # The same suite the other SDKs pass, through a real MCP client over
    # stdio, on both protocol revisions the Ruby MCP SDK speaks.
    strategy:
      fail-fast: false
      matrix:
        protocol: ['2025', '2026']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite passes the adapter nothing but PATH, so the adapter names its
      # own Gemfile, and bundler finds the installed gems from its config.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: conformance/adapters/ruby

      - run: pnpm --filter @mcpspan/conformance test
        env:
          CONFORMANCE_ADAPTER: '["ruby", "adapters/ruby/server.rb"]'
          CONFORMANCE_PROTOCOL: ${{ matrix.protocol }}
