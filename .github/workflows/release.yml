name: Release

# One SDK at a time, from a GitHub release whose tag names the package and its
# version:
#
#   mcpspan/v0.1.0                npm
#   mcpspan-python/v0.1.0         PyPI
#   packages/mcpspan-go/v0.1.0    Go (the tag Go itself reads; the mcpsdk and mcpgo modules are tagged with it)
#   mcpspan-dotnet/v0.1.0         NuGet
#   mcpspan-jvm/v0.1.0            Maven Central
#   mcpspan-rust/v0.1.0           crates.io
#   mcpspan-ruby/v0.1.0           RubyGems
#   sdks/v0.2.0                   all seven at once, approved in one go
#   all/v0.7.0                    all seven and the server's images (images.yml), one version for all
#   core/v0.9.0                   the server's images (images.yml) and mcpspan-mcp, npm and the MCP Registry
#
# PHP is released from github.com/mcpspan/mcpspan-php, which Packagist reads.
#
# Every job runs in the `release` environment, so nothing is published until it
# is approved there. The version in the tag must be the version in the code.
# Actions are pinned to commits: this workflow can publish.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'mcpspan/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcpspan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Version matches the tag
        run: test "$(node -p "require('./package.json').version")" = "${TAG##*/v}"
      # npm runs the package's prepublishOnly before publishing: build, types, tests, README samples.
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      # By the repository's identity, with no token at all.
      - run: npm publish --provenance --access public

  # The MCP server for agents, which reads the API's routes and so goes out
  # with the server (core/v and all/v), then into the MCP Registry.
  mcp:
    if: startsWith(github.event.release.tag_name, 'core/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # npm's trusted publishing, and the MCP Registry's login, both by the repository's identity.
      id-token: write
    defaults:
      run:
        working-directory: packages/mcpspan-mcp
    # Its tests read through the real API, which needs its database.
    services:
      db:
        image: timescale/timescaledb:2.30.1-pg17
        env:
          POSTGRES_USER: mcpspan
          POSTGRES_PASSWORD: mcpspan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcpspan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MCP_TEST_DATABASE_URL: postgres://mcpspan:mcpspan@localhost:5432/mcpspan_mcp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Version matches the tag
        run: |
          version="${TAG##*/v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./server.json').version")" = "$version"
          test "$(node -p "require('./server.json').packages[0].version")" = "$version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Packed by pnpm, which writes the workspace's own dependencies out as
      # versions (npm would publish "workspace:*"), then published by npm,
      # which trusted publishing needs.
      - run: pnpm pack --out package.tgz
      - run: npm install --global npm@11
      # Skipped when this version is on npm already, as the very first one is:
      # trusted publishing can only be set up for a package that exists, so
      # that one was published by hand. The registry entry still follows.
      - name: Publish to npm
        run: |
          version="${TAG##*/v}"
          if npm view "mcpspan-mcp@$version" version > /dev/null 2>&1; then
            echo "mcpspan-mcp $version is on npm already"
          else
            npm publish package.tgz --provenance --access public
          fi
      # Pinned and checked against the release's own checksums: this step publishes.
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  pypi:
    if: startsWith(github.event.release.tag_name, 'mcpspan-python/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcpspan-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Version matches the tag
        run: grep -qx "SDK_VERSION = \"${TAG##*/v}\"" src/mcpspan/_version.py
      - run: uv sync --locked --group mcp2 && uv run --group mcp2 pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/mcpspan-python/dist

  go:
    if: startsWith(github.event.release.tag_name, 'packages/mcpspan-go/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # To tag the two integration modules alongside the core.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version matches the tag
        run: |
          version="v${TAG##*/v}"
          grep -qx "const Version = \"${version#v}\"" packages/mcpspan-go/internal/core/event.go
          # The integrations must ask for the core being released, since their
          # local replace means nothing to anybody who installs them.
          for module in mcpsdk mcpgo; do
            grep -q "github.com/mcpspan/mcpspan/packages/mcpspan-go ${version}$" "packages/mcpspan-go/$module/go.mod"
          done
      # The tags Go reads: the core's, unless the release was made with it, and the integrations'.
      - name: Tag the modules
        run: |
          version="v${TAG##*/v}"
          for module in "" /mcpsdk /mcpgo; do
            tag="packages/mcpspan-go${module}/${version}"
            if [ "$tag" != "$TAG" ]; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            fi
          done
      # Asks the public Go proxy for each module, so the first person to install
      # it is not the one who waits.
      - name: Announce to the Go proxy
        run: |
          version="v${TAG##*/v}"
          for module in "" /mcpsdk /mcpgo; do
            path="github.com/mcpspan/mcpspan/packages/mcpspan-go${module}"
            curl --fail --silent --show-error --retry 5 --retry-delay 10 \
              "https://proxy.golang.org/${path}/@v/${version}.info"
            echo
          done

  nuget:
    if: startsWith(github.event.release.tag_name, 'mcpspan-dotnet/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcpspan-dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Version matches the tag
        run: grep -q "<Version>${TAG##*/v}</Version>" src/McpSpan/McpSpan.csproj
      - run: dotnet test -c Release
      - run: dotnet pack src/McpSpan -c Release -o out
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          # The nuget.org account, kept in the environment rather than in the code.
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  maven:
    if: startsWith(github.event.release.tag_name, 'mcpspan-jvm/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/mcpspan-jvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Version matches the tag
        run: grep -q "version = \"${TAG##*/v}\"" build.gradle.kts
      - name: Build, test, sign
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew build publishAllPublicationsToStagingRepository
      # One bundle for both artifacts, uploaded to the Central Portal and
      # released once it validates. Maven Central keeps no metadata files of a
      # publisher's own.
      - name: Upload to Maven Central
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd build/staging
          find . -name 'maven-metadata*' -delete
          zip -qr ../bundle.zip com
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          id=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            -F "bundle=@../bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${TAG}&publishingType=AUTOMATIC")
          echo "deployment $id"
          for _ in $(seq 1 60); do
            state=$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED)
                curl --silent -X POST -H "Authorization: Bearer $token" \
                  "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq .
                exit 1 ;;
            esac
            sleep 20
          done
          echo "still not validated after 20 minutes; see the Central Portal"
          exit 1

  crates:
    if: startsWith(github.event.release.tag_name, 'mcpspan-rust/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcpspan-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Version matches the tag
        run: grep -qx "version = \"${TAG##*/v}\"" Cargo.toml
      - run: cargo test
      # A short-lived token for this run, in exchange for the repository's identity.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  rubygems:
    if: startsWith(github.event.release.tag_name, 'mcpspan-ruby/v') || startsWith(github.event.release.tag_name, 'sdks/v') || startsWith(github.event.release.tag_name, 'all/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcpspan-ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: packages/mcpspan-ruby
      - name: Version matches the tag
        run: grep -q "VERSION = \"${TAG##*/v}\"" lib/mcpspan/version.rb
      - run: bundle exec rake
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem build mcpspan.gemspec && gem push mcpspan-*.gem
