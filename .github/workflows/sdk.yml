name: SDK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only where the code is public: the private repository is tested before every export.
    if: github.repository == 'mcpspan/mcpspan'
    name: Build, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      # Frozen, so a lockfile that disagrees with the manifests fails here
      # rather than quietly resolving to something nobody has run locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter mcpspan build
      - run: pnpm --filter mcpspan typecheck
      - run: pnpm --filter mcpspan test

      # The README is the first thing a reader runs. Its samples are checked
      # against the built package, so a rename that misses the documentation
      # fails here rather than on somebody else's machine.
      - run: pnpm --filter mcpspan check:readme

      # The SDK against docs/sdk-contract.md, through a real MCP client and a
      # fake ingest API. Other languages' SDKs run the same suite. Three runs,
      # because the official MCP SDK has two major versions in use and the
      # protocol two revisions: v1 speaks the 2025 protocol only, v2 both.
      - run: pnpm --filter @mcpspan/conformance typecheck

      - name: Conformance, MCP SDK v1, protocol 2025-11-25
        run: pnpm --filter @mcpspan/conformance test
        env:
          CONFORMANCE_ADAPTER: '["node", "adapters/typescript/server.mjs"]'
          CONFORMANCE_PROTOCOL: '2025'

      - name: Conformance, MCP SDK v2, protocol 2025-11-25
        run: pnpm --filter @mcpspan/conformance test
        env:
          CONFORMANCE_ADAPTER: '["node", "adapters/typescript-v2/server.mjs"]'
          CONFORMANCE_PROTOCOL: '2025'

      - name: Conformance, MCP SDK v2, protocol 2026-07-28
        run: pnpm --filter @mcpspan/conformance test
        env:
          CONFORMANCE_ADAPTER: '["node", "adapters/typescript-v2/server.mjs"]'
          CONFORMANCE_PROTOCOL: '2026'

  oldest-node:
    # Only where the code is public: the private repository is tested before every export.
    if: github.repository == 'mcpspan/mcpspan'
    name: Runs on the oldest supported Node
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mcpspan build

      # The package declares Node 18. Types are checked against that version,
      # but a type definition is a claim about an API, not proof it is there:
      # only running the built output on that runtime settles it. Vitest needs
      # Node 20, so this is a plain script rather than the test suite.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 18

      - name: Exercise the built package
        working-directory: packages/mcpspan
        run: node scripts/oldest-node-check.mjs
